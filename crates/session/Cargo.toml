[package]
name = "mdedit-session"
version = "0.1.0"
description = "Open tabs as lightweight handles, and the session file that restores them"
keywords = ["editor", "session", "tabs", "markdown"]
categories = ["text-editors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdedit-document.workspace = true
mdedit-language.workspace = true
mdedit-file.workspace = true
mdedit-offsets.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
