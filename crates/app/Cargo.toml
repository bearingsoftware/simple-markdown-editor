[package]
name = "mdedit-app"
version = "0.1.0"
description = "The editor window: winit, wgpu, and the decoration that turns a document into glyphs"
keywords = ["markdown", "editor", "wgpu", "winit"]
categories = ["text-editors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mdedit"
path = "src/main.rs"

[dependencies]
mdedit-document.workspace = true
mdedit-file.workspace = true
mdedit-session.workspace = true
mdedit-markers.workspace = true
mdedit-menu-win.workspace = true
mdedit-offsets.workspace = true
mdedit-text.workspace = true
# 0.30, not 0.31: that line is still beta, and AGENTS.md rejects depending on unreleased churn.
# Default features pull in Wayland client-side decorations, which drag in `ttf-parser` — an
# unmaintained crate (RUSTSEC-2026-0192) that a Windows-first editor has no use for. X11 only
# keeps Linux compiling without it; a real Wayland backend is a decision for when we ship there.
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
thiserror.workspace = true
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
mdedit-text-dwrite.workspace = true
# Native dialogs, per the stack decision in AGENTS.md. Windows-only: rfd's Linux backend needs GTK
# development headers, which would make the workspace unbuildable on CI for a dialog that only the
# Windows build can ever show.
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
