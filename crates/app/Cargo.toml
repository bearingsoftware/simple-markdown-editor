[package]
name = "mdedit-app"
version = "0.3.0"
description = "The editor window: winit, wgpu, and the decoration that turns a document into glyphs"
keywords = ["markdown", "editor", "wgpu", "winit"]
categories = ["text-editors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# One integration-test binary rather than one per file (MDEDIT-182): each is a full link of the
# editor, and a change to the library relinked seventy-five of them. See `tests/main.rs`.
autotests = false

[[bin]]
name = "mdedit"
path = "src/main.rs"

[[test]]
name = "app"
path = "tests/main.rs"

[dependencies]
mdedit-document.workspace = true
mdedit-image.workspace = true
mdedit-file.workspace = true
mdedit-session.workspace = true
mdedit-json.workspace = true
mdedit-yaml.workspace = true
mdedit-xml.workspace = true
mdedit-toml.workspace = true
mdedit-ini.workspace = true
mdedit-highlight.workspace = true
mdedit-language.workspace = true
mdedit-markers.workspace = true
mdedit-menu-win.workspace = true
mdedit-offsets.workspace = true
mdedit-text.workspace = true
# 0.30, not 0.31: that line is still beta, and AGENTS.md rejects depending on unreleased churn.
# Default features pull in Wayland client-side decorations, which drag in `ttf-parser` — an
# unmaintained crate (RUSTSEC-2026-0192) that a Windows-first editor has no use for. X11 only
# keeps Linux compiling without it; a real Wayland backend is a decision for when we ship there.
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"
thiserror.workspace = true
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
mdedit-text-dwrite.workspace = true
mdedit-shell-win.workspace = true
# Native dialogs, per the stack decision in AGENTS.md. Windows-only: rfd's Linux backend needs GTK
# development headers, which would make the workspace unbuildable on CI for a dialog that only the
# Windows build can ever show.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
# The encoder, so a test writes a real PNG rather than asserting against bytes it hardcoded.
png.workspace = true

[lints]
workspace = true
