[package]
name = "mdedit-markers"
version = "0.1.0"
description = "Partitions Markdown source into syntax-marker and content spans for live-preview editing"
keywords = ["markdown", "commonmark", "editor", "syntax"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdedit-offsets.workspace = true
mdedit-language.workspace = true
pulldown-cmark.workspace = true

[features]
# The seam MDEDIT-131's benchmark measures a parser option through — see `bench` in lib.rs. Off by
# default so the editor cannot reach it, and enabled by the bench target below.
bench = []

[dev-dependencies]
criterion = "0.7"
pulldown-cmark.workspace = true
proptest = "1.11.0"
serde_json = "1"

[[bench]]
name = "segment"
harness = false

[[bench]]
name = "options"
harness = false
required-features = ["bench"]

[lints]
workspace = true
