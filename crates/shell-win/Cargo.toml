[package]
name = "mdedit-shell-win"
version = "0.1.0"
description = "Windows shell integration: the DropTarget verb, so opening N files from Explorer reuses one process. Windows only."
keywords = ["windows", "shell", "com", "explorer", "editor"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

# `windows` rather than `windows-sys`, and pinned to the version `mdedit-text-dwrite` already uses so
# the tree holds one copy. The `#[implement]` macro is why: hand-rolling a COM vtable for
# `IDropTarget` and `IClassFactory` is exactly the kind of unsafe this project does not need to write
# twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.62"

[lints]
workspace = true
