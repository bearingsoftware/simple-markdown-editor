[package]
name = "mdedit-highlight"
version = "0.1.0"
description = "Syntax highlighting for fenced code, chosen by the fence's info string and nothing else"
keywords = ["syntax", "highlight", "editor", "markdown"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `fancy-regex`, not Oniguruma: a fence's contents are untrusted file contents and `onig` is C
# (MDEDIT-190). `deny.toml` bans both crates so a feature flip cannot bring them back.
[dependencies]
mdedit-language.workspace = true
mdedit-offsets.workspace = true
syntect.workspace = true

# The build script reads the vendored `.sublime-syntax` files, so it alone needs the YAML loader and
# syntect's own default dump. Neither reaches the binary. Still `fancy-regex`, never `onig`.
[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "yaml-load", "dump-create", "regex-fancy"] }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
