[package]
name = "mdedit-document"
version = "0.1.0"
description = "Rope-backed Markdown buffer that keeps its marker/content segmentation current across edits"
keywords = ["markdown", "editor", "rope", "text"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdedit-language.workspace = true
mdedit-markers.workspace = true
mdedit-offsets.workspace = true
ropey.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
criterion = "0.7"
# Test-only, and deliberately not real dependencies: this crate is language-agnostic, and the
# scoped-lex gate needs concrete languages to hold it against.
mdedit-json.workspace = true
mdedit-yaml.workspace = true
mdedit-toml.workspace = true
mdedit-ini.workspace = true
proptest = "1.11.0"

[[bench]]
name = "undo"
harness = false

[lints]
workspace = true
