[package]
name = "sme-vscode-core"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["highlight"]
highlight = ["dep:mdedit-highlight"]

[dependencies]
mdedit-offsets = { path = "../../../crates/offsets" }
mdedit-language = { path = "../../../crates/language" }
mdedit-markers = { path = "../../../crates/markers" }
mdedit-document = { path = "../../../crates/document" }
mdedit-highlight = { path = "../../../crates/highlight", optional = true }
wasm-bindgen = "=0.2.129"
