[workspace]
resolver = "3"
members = [
    "crates/offsets",
    "crates/language",
    "crates/json",
    "crates/yaml",
    "crates/xml",
    "crates/toml",
    "crates/ini",
    "crates/markers",
    "crates/image",
    "crates/document",
    "crates/text",
    "crates/text-dwrite",
    "crates/menu-win",
    "crates/shell-win",
    "crates/file",
    "crates/session",
    "crates/app",
]
# Spikes are throwaway probes, deliberately outside the workspace so they stay out of CI.
exclude = ["spikes/*", "fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.90"   # raised from 1.87 by muda 0.21. See AGENTS.md.
license = "MIT"
repository = "https://github.com/bearingsoftware/simple-markdown-editor"

[workspace.dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
thiserror = "2"
# Unicode word boundaries, for double-click and eventually Ctrl+arrows and MDEDIT-50. Pure Rust,
# no build script, MIT/Apache — see `Document::word_at` for why the alternative was rejected.
unicode-segmentation = "1.12"
# PNG decoding, for MDEDIT-146. **`png` directly rather than `image`**, and the reason is the whole
# of why the decoder decision took evidence: `png` 0.18 is `#![forbid(unsafe_code)]`, so the chunk
# parser — the part that reads bytes an attacker chose and decides how long a buffer is — has none.
# Taking `image` for the same two formats pulls `moxcms` and `pxfm` for colour management this editor
# never uses, and those two carry ~570 lines of `unsafe` SIMD between them. AGENTS.md names file
# parsing as this project's trust boundary and its CVE class; this is what acting on that looks like.
png = { version = "0.18", default-features = false }
# `version` alongside `path` is not redundant: without it this is a wildcard dependency,
# which deny.toml rejects.
mdedit-language = { path = "crates/language", version = "0.1.0" }
mdedit-json = { path = "crates/json", version = "0.1.0" }
mdedit-yaml = { path = "crates/yaml", version = "0.1.0" }
mdedit-xml = { path = "crates/xml", version = "0.1.0" }
mdedit-toml = { path = "crates/toml", version = "0.1.0" }
mdedit-ini = { path = "crates/ini", version = "0.1.0" }
mdedit-markers = { path = "crates/markers", version = "0.1.0" }
mdedit-image = { path = "crates/image", version = "0.1.0" }
mdedit-offsets = { path = "crates/offsets", version = "0.1.0" }
mdedit-text = { path = "crates/text", version = "0.1.0" }
mdedit-text-dwrite = { path = "crates/text-dwrite", version = "0.1.0" }
mdedit-menu-win = { path = "crates/menu-win", version = "0.1.0" }
mdedit-shell-win = { path = "crates/shell-win", version = "0.1.0" }
mdedit-document = { path = "crates/document", version = "0.1.0" }
mdedit-file = { path = "crates/file", version = "0.1.0" }
mdedit-session = { path = "crates/session", version = "0.1.0" }

# Lint levels live here because clippy.toml can tune lints but cannot enable them.
# Vendored from code-standards v1.2.0 `configs/clippy.toml`.
[workspace.lints.rust]
unsafe_code = "deny"          # not "forbid" — forbid can't be locally downgraded for a future FFI module
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
float_cmp = "warn"
mem_forget = "deny"
await_holding_lock = "deny"
lossy_float_literal = "deny"

# The one departure from the baseline's set, and it is about what the replacement reads like rather
# than about the rule. `assert_is_empty` landed in clippy 1.99 inside `all`, so `-D warnings` turned
# forty-one `assert!(thing.is_empty())` across nineteen files into errors overnight — in a repository
# nobody had pushed to for a fortnight, which is how CI came to be red with no change of ours.
#
# Its suggestion is `assert_eq!(analysis.segments, [] as [Segment; 0])`: the item type spelled out at
# every site, and the type imported where it was not needed before. The lint's own reason — show the
# value on failure — is the right instinct and is better served here by a message, which this
# codebase's asserts carry anyway. So the lint is off and the habit stays.
#
# **Raise it in `bearingsoftware/code-standards` rather than copying this block.** Every repository
# on the baseline hits this the first time its CI sees clippy 1.99.
assert_is_empty = "allow"

# Overflow wraps silently in release by default, so the panic that catches a bad offset in tests
# would be absent in production. standards/rust.md requires turning it back on.
#
# **Do not set `panic = "abort"` here.** `mdedit-markers` contains a `pulldown-cmark` panic with
# `catch_unwind` so that a document upstream cannot parse opens as plain text instead of killing the
# editor (MDEDIT-114). Aborting turns that back into a crash on file open, and nothing would fail:
# the test that covers it runs under the test profile, not this one.
[profile.release]
overflow-checks = true

# What `cargo-mutants` builds each mutant with (MDEDIT-182), set in `.cargo/mutants.toml`. The test
# profile without debug info: a mutant's build is a link of the editor and its tests, and debug info
# is most of what a link writes. Measured on MDEDIT-182 at 18 s a mutant with it and 7 s without.
# Nothing here is ever run under a debugger; a surviving mutant is reproduced with an ordinary build.
[profile.mutants]
inherits = "test"
debug = "none"
