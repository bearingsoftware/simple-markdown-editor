name: Fuzz

# MDEDIT-111. Linux only, and not as a compromise: `libfuzzer-sys` builds a C++ runtime and is
# Unix-only, while the four crates fuzzed here are platform-agnostic by design. The one platform
# thing it buys on the way is AddressSanitizer, which rustc does not support on Windows in 2026.
#
# **Everything runs GitHub-hosted** (MDEDIT-136): this repository is public, so a fork's pull request
# can start these jobs and must never reach a self-hosted runner. The weekly run moved with the rest
# rather than staying on the pool: half an hour a target is far inside the 6-hour hosted job limit,
# and one runner label for the whole file is easier to keep correct than a per-event expression.
#
# Two cadences. On a pull request each target gets five minutes, which is enough to reach the shallow
# input and short enough that nobody starts skipping the job; the weekly run gets half an hour a
# target and starts from the corpus the PR runs left behind.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sunday, 03:00 UTC. Long runs belong where nobody is waiting for them.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# A superseded push must not keep seven targets running for a commit nobody will read.
#
# The schedule is exempt: a weekly long run cancelled by a Sunday push is a week of fuzzing lost
# rather than a minute saved.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # **`markers_segment` reports rather than blocks, and only until upstream fixes MDEDIT-114.**
    #
    # `pulldown-cmark` 0.13.4 panics on documents this target reaches in about two minutes, and the
    # editor contains that with `catch_unwind` — but `libfuzzer-sys` installs a panic hook that
    # *aborts* before anything unwinds, so the containment is invisible here and the target dies on a
    # defect that is neither ours nor reachable in the shipped editor. Blocking every pull request on
    # somebody else's unwrap is worse than not running it.
    #
    # **`continue-on-error` alone did not do that**, which took three pull requests to notice: it
    # keeps the workflow green and still publishes a *failing check*, and a failing check makes the
    # pull request unmergeable. It found the panic on some runs and not others, so what it produced
    # was an intermittently unmergeable branch. The swallow is in the Fuzz step below; this stays
    # because it is the honest description of the job either way.
    #
    # The cost is that a genuine marker-locator crash would also only report, which is why the
    # containment has a unit test of its own (`a_document_that_panics_the_parser_comes_back_as_content`)
    # and why both come back the moment upstream lands a fix.
    continue-on-error: ${{ matrix.target == 'markers_segment' }}
    strategy:
      # One failing target must not cancel the other three: which inputs the others found is the
      # useful half of the report.
      fail-fast: false
      matrix:
        target:
          - markers_segment
          - json_validate
          - json_format
          - yaml_analyze
          - xml_analyze
          - toml_analyze
          - ini_analyze
    steps:
      - uses: actions/checkout@v4

      # `cargo fuzz` needs nightly. Nothing else in this repo does, and nothing stable builds here.
      #
      # Installing it is no longer enough on its own: `rust-toolchain.toml` pins the repository to
      # stable, and a bare `cargo fuzz` obeys that file wherever it is run from — so the run below
      # says `+nightly` outright and dies on a missing nightly rather than on `-Z` under stable.
      - uses: dtolnay/rust-toolchain@nightly
      # Saved on `main` only, for the reason in `ci.yml` (MDEDIT-132). The weekly schedule runs
      # against `main` too, so the long runs still refresh it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `with: tool:` rather than the `@cargo-fuzz` tag form. There is no such tag, and the action
      # does not fail when it cannot find one — it warns "no tool specified", installs nothing, and
      # succeeds, so the failure surfaces four lines later as `no such command: fuzz`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The corpus is the point of running this repeatedly: a fuzzer that starts from nothing every
      # time re-derives "a document begins with a brace" on every run.
      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # `--target` is pinned to gnu because cargo-fuzz defaults to musl here, and musl links libc
      # statically — which the sanitizer refuses outright ("sanitizer is incompatible with statically
      # linked libc"), before the target is even installed. ASan is half the reason this job exists,
      # so the target that supports it is the one to build for.
      - name: Fuzz
        id: fuzz
        # **`markers_segment` reports as an annotation, not as a red check.** `continue-on-error`
        # keeps the *workflow* green but still publishes a failing check, and a failing check makes
        # the pull request unmergeable — which is the thing it was set to avoid. So that one target
        # swallows its exit status here and writes a warning instead; every other target fails
        # normally. See the job comment for why this one cannot be trusted to fail for our reasons.
        #
        # It is not silent: the artifact upload below is keyed off this rather than off `failure()`,
        # so the crashing input is kept either way.
        run: |
          set +e
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_total_time=${{ github.event_name == 'schedule' && 1800 || 300 }} \
            -max_len=16384
          status=$?
          set -e
          echo "crashed=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "${{ matrix.target }}" = "markers_segment" ]; then
            echo "::warning title=markers_segment crashed::Almost certainly MDEDIT-114 — \
              pulldown-cmark#1129, contained in the editor and invisible to libFuzzer. \
              The input is in this run's artifacts; check it before assuming."
            exit 0
          fi
          exit "$status"

      # A crash is worth more than the run that found it: without the input, the next person has a
      # stack trace and no way to reproduce it. Keyed off the exit status rather than `failure()`,
      # because `markers_segment` above deliberately does not fail.
      - name: Keep whatever crashed it
        if: always() && steps.fuzz.outputs.crashed != '0'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
