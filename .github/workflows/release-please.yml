name: Release Please

# A merged release PR tags and publishes. `release-as` in release-please-config.json pins the first
# release to 0.1.0; remove it after that release so versions follow the commits again.

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # No fallback to GITHUB_TOKEN: this repository forbids it from creating PRs, and a PR it
          # opened would not start CI anyway. A missing secret should fail loudly.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
