name: CI

# **Where these run is a cost decision, not a technical one** (MDEDIT-115). This repository is
# private, so every GitHub-hosted minute is billed and Windows minutes bill at twice the Linux rate.
# Everything that can run on the self-hosted Linux box does; what is left on GitHub-hosted is the
# Windows leg, because there is no self-hosted Windows runner and Windows is the only platform this
# editor actually runs on. See `mdedit-shell-win` and the DirectWrite backend for why dropping it is
# not an option.
#
# The self-hosted labels are the ones `project-status.yml` has been using since MDEDIT-83, so the box
# is known to have a working rustup, cache and `taiki-e/install-action`.

# `paths-ignore` goes on each event rather than beside them — at the top level it is silently
# ignored. Documentation-only changes compile nothing: Rust doc comments live in `.rs` files, so this
# skips prose only — AGENTS.md, the research briefs, the plans.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

# A later commit supersedes the one before it, so the one before stops costing money. Without this a
# branch pushed three times in a minute paid for three full Windows runs, two of which nobody would
# ever read — and five pull requests merged in a row paid for five runs of `main`.
#
# **`main` cancels too**, which is the opposite of the usual advice and right here. Its runs feed the
# status board through `workflow_run`, and the board wants the *newest* commit: an intermediate
# coverage number that nobody will look at is not worth a Windows run at twice the rate. The last
# merge of a batch still measures.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Windows is the primary target, so it gates every PR rather than being a nightly afterthought.
  # It also catches what Linux cannot: line endings, path handling, and the platform layer.
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, Linux, X64, proxmox, general]
            # The whole suite, because this one is free.
            everything: true
          - os: windows-latest
            runner: windows-latest
            everything: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # **Skipped on Windows**, and not because it is unimportant: `rustfmt` produces the same answer
      # on every platform, and `.gitattributes` pins line endings to LF, so the Linux leg is a
      # complete check. Paying twice the rate for a second opinion on formatting is the sort of spend
      # that adds up to a month of no CI at all.
      - name: rustfmt
        if: matrix.everything
        run: cargo fmt --all --check

      # Clippy runs on both, and that one is not optional: `mdedit-text-dwrite`, `mdedit-menu-win`
      # and `mdedit-shell-win` are `cfg(windows)` and compile to nothing on Linux. Their lints — and
      # their `unsafe` — are only ever seen here.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # nextest rather than `cargo test`: every test gets its own process. MDEDIT-67 was a heap
      # corruption caused by two threads of one process reading the Windows clipboard, and it aborted
      # a whole test binary — the isolation is the defense against that class. See .config/nextest.toml.
      - name: test
        run: cargo nextest run --profile ci --all-features

      # nextest does not run doctests; cargo still owns those, and this project has them.
      - name: doctest
        run: cargo test --all-features --doc

      # Broken intra-doc links are denied in [workspace.lints.rustdoc]. Linux only, for the rustfmt
      # reason: a doc link resolves the same either way, and the Windows-only crates' docs are the
      # one part this cannot see — which `cargo clippy` above already compiled.
      - name: doc
        if: matrix.everything
        run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV
    runs-on: [self-hosted, Linux, X64, proxmox, general]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  deny:
    name: cargo-deny
    runs-on: [self-hosted, Linux, X64, proxmox, general]
    steps:
      - uses: actions/checkout@v4
      # The Docker action brought its own Rust; nothing else does. Without this the job dies on
      # `cargo: command not found`, which is what it did the first time.
      - uses: dtolnay/rust-toolchain@stable
      # `taiki-e/install-action` rather than `EmbarkStudios/cargo-deny-action`, which is a Docker
      # action: a container runtime is one more thing the self-hosted box would have to have, and
      # this is the same installer the other three jobs already use here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
