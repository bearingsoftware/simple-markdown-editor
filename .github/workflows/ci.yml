name: CI

# **Where these run is a security decision first** (MDEDIT-136). The repository is public, so any
# `pull_request` job can be started by whoever opens a fork PR, and on a self-hosted runner that is
# arbitrary code on a machine we own. So nothing here runs on the self-hosted pool: every job is
# GitHub-hosted, where the runner is discarded after the job and minutes are free for a public
# repository. MDEDIT-115 put the Linux jobs on the pool to save billed minutes while the repository
# was private; that reason is gone. The Windows leg was always hosted, because there is no
# self-hosted Windows runner and Windows is the only platform this editor actually runs on. See
# `mdedit-shell-win` and the DirectWrite backend for why dropping it is not an option.

# `paths-ignore` goes on each event rather than beside them — at the top level it is silently
# ignored. Documentation-only changes compile nothing: Rust doc comments live in `.rs` files, so this
# skips prose only — AGENTS.md, the research briefs, the plans.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  # The status board dispatches this when its data for the project goes stale (MDEDIT-195). Without the
  # trigger every dispatch failed 422 and the project stayed stale.
  workflow_dispatch:

# Nothing here writes to the repository, so the token cannot either. Matters more now the workflow can
# be started by hand.
permissions:
  contents: read

# A later commit supersedes the one before it, so the one before stops costing money. Without this a
# branch pushed three times in a minute paid for three full Windows runs, two of which nobody would
# ever read — and five pull requests merged in a row paid for five runs of `main`.
#
# **`main` cancels too**, which is the opposite of the usual advice and right here. Its runs feed the
# status board through `workflow_run`, and the board wants the *newest* commit: an intermediate
# coverage number that nobody will look at is not worth a Windows run at twice the rate. The last
# merge of a batch still measures.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Windows is the primary target, so it gates every PR rather than being a nightly afterthought.
  # It also catches what Linux cannot: line endings, path handling, and the platform layer.
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            # The whole suite, because this one is free.
            everything: true
          - os: windows-latest
            runner: windows-latest
            everything: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # **A pull request restores this cache and never uploads one** (MDEDIT-132). Saving was costing
      # more than the whole job it was meant to speed up: on run 31839765178 the real work took 3m11s
      # and the save that followed took **16m37s**, pushing 515 MB at the 0.4–0.5 MB/s the GitHub
      # Actions cache backend gives these runners. Across the self-hosted legs that was ~920 MB a
      # pull request.
      #
      # And the restore had already *missed*, structurally rather than by luck: rust-cache's workspace
      # hash covers `Cargo.lock` and every `crates/*/Cargo.toml`, so any change touching a manifest is
      # a guaranteed full miss — then a full upload of a cache the next manifest change also misses.
      #
      # What this gives up is a second push to the same branch restoring the first push's cache. That
      # is worth less than 16 minutes: `concurrency` above cancels the earlier run, often before it
      # reaches the save step at all.
      # **And `target/` is not cached at all**, which the first half of MDEDIT-132 made measurable.
      # With saving off, a pull request's restore became the whole cost: 5m02s to pull 695 MB at
      # 2.3 MB/s, against a *cold* build of 3m11s. Paying five minutes to skip three is not a cache,
      # so only `~/.cargo` — the registry and git checkouts, which are small and genuinely reusable
      # across manifest changes — is kept.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      - uses: taiki-e/install-action@nextest

      # **Skipped on Windows**, and not because it is unimportant: `rustfmt` produces the same answer
      # on every platform, and `.gitattributes` pins line endings to LF, so the Linux leg is a
      # complete check. Paying twice the rate for a second opinion on formatting is the sort of spend
      # that adds up to a month of no CI at all.
      - name: rustfmt
        if: matrix.everything
        run: cargo fmt --all --check

      # Clippy runs on both, and that one is not optional: `mdedit-text-dwrite`, `mdedit-menu-win`
      # and `mdedit-shell-win` are `cfg(windows)` and compile to nothing on Linux. Their lints — and
      # their `unsafe` — are only ever seen here.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # nextest rather than `cargo test`: every test gets its own process. MDEDIT-67 was a heap
      # corruption caused by two threads of one process reading the Windows clipboard, and it aborted
      # a whole test binary — the isolation is the defense against that class. See .config/nextest.toml.
      - name: test
        run: cargo nextest run --profile ci --all-features

      # nextest does not run doctests; cargo still owns those, and this project has them.
      - name: doctest
        run: cargo test --all-features --doc

      # Broken intra-doc links are denied in [workspace.lints.rustdoc]. Linux only, for the rustfmt
      # reason: a doc link resolves the same either way, and the Windows-only crates' docs are the
      # one part this cannot see — which `cargo clippy` above already compiled.
      - name: doc
        if: matrix.everything
        run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      # Saved on `main` only and registry-only, for the reasons on the `check` job above. This one
      # runs a bare `cargo check`, so it had the least to gain from a `target/` cache and was still
      # paying 158 MB for it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      # **`+1.90.0` explicitly, and that is load-bearing since `rust-toolchain.toml` exists.** The
      # file pins the repository to stable, and a bare `cargo` here would obey it — so this job would
      # have installed 1.90.0, ignored it, checked against stable and passed. An MSRV job that
      # silently stops checking the MSRV is worse than no MSRV job, because the badge still says it
      # is covered. An explicit `+toolchain` overrides the file, which is the whole reason the pin is
      # safe to add.
      - run: cargo +1.90.0 check --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Docker action brought its own Rust; nothing else does. Without this the job dies on
      # `cargo: command not found`, which is what it did the first time.
      - uses: dtolnay/rust-toolchain@stable
      # `taiki-e/install-action` rather than `EmbarkStudios/cargo-deny-action`, which is a Docker
      # action: this is the same installer the other jobs already use here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
