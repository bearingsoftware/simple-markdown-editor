name: Mutants

# MDEDIT-111, and a **trial** rather than a gate — `continue-on-error`, so a surviving mutant is a
# comment on a pull request rather than a red build. Promote it to blocking if it earns its keep.
#
# What it is for: this is a solo project, so nothing in it has had a second reviewer. cargo-mutants
# is the mechanical version of one — it changes a `<` to a `<=`, deletes a line, replaces a return
# value, and reports what the tests still let through. The review that produced this ticket found
# several tests whose bodies could not fail; that is exactly the class this detects without anybody
# having to read for it.
#
# `--in-diff`, so it mutates only what a pull request changed. A whole-workspace run is hours and
# would never be looked at; a diff-sized one is minutes and lands with the change that caused it.

on:
  pull_request:
  workflow_dispatch:

# A superseded push should stop costing the one runner time it could be giving the next pull request.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (in diff)
    runs-on: [self-hosted, Linux, X64, proxmox, general]
    # A trial. It reports; it does not block.
    continue-on-error: true
    # **Under the pool's limit, not GitHub's (MDEDIT-171).** The self-hosted pool stops any job
    # at 60 minutes of execution (FINCH-274) whatever the workflow asks for, and with no value
    # here GitHub allowed 360 — so PR #166 lost both attempts' reports to a host-side kill with
    # nothing saying why. This is the backstop; the Mutate step has its own, shorter budget so
    # it can stop cleanly and say so.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the merge base, which a shallow clone does not have.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      # **This workflow can never have a cache, and that is structural** (MDEDIT-132). It runs on
      # `pull_request` and `workflow_dispatch` only, so no `main`-scoped cache is ever written for a
      # pull request to restore — and `save-if` below makes that explicit rather than leaving the job
      # uploading 66–70 MB per run into a scope nothing reads. Registry downloads are the cost, and
      # they are the small half.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # **Built from source, unlike nextest.** The prebuilt `cargo-mutants` was linked against
      # GLIBC 2.39 and the self-hosted box was older than that, so the downloaded binary died on
      # `version 'GLIBC_2.39' not found` before it had done anything. Worth re-testing against the
      # pristine runner image, which may have moved past that — MDEDIT-132 leaves it open rather than
      # guessing, because a failed install step publishes a failing check on a job that must not
      # block.
      - name: Install cargo-mutants
        # **The guard is for a runner that already has the binary, not for a cache.** It used to say
        # `cache-bin: true` kept `~/.cargo/bin` between runs; the log disproves that. On run
        # 31839765178 rust-cache reported `No cache found` at 20:51:02 and six seconds later this
        # step resolved in 26 ms — the binary came off a long-lived runner's disk, not off the GitHub
        # cache. The general pool is ephemeral now, so this compiles ~250 crates every run.
        #
        # It stays because `cargo install` *stops* rather than skips when it finds its own binary in
        # place — `binary 'cargo-mutants' already exists in destination`, exit 101, and a red X on a
        # job whose whole point is to report rather than block. `--force` would avoid that by
        # rebuilding unconditionally, which is what this already effectively does.
        run: |
          if ! command -v cargo-mutants >/dev/null 2>&1; then
            cargo install cargo-mutants --locked
          else
            echo "cargo-mutants $(cargo mutants --version) already on this runner"
          fi

      - name: What this pull request changed
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      # nextest as the runner, for the same isolation reason CI uses it: a mutant that makes a test
      # hang or abort must take down its own process and nothing else.
      #
      # **An exclude list, because the allow-list failed twice (MDEDIT-155).**
      #
      # The three Windows-only crates are named here because they do not build on this runner at
      # all: `mdedit-text-dwrite`, `mdedit-menu-win` and `mdedit-shell-win` are `cfg(windows)`, and
      # their tests want a real system stack anyway. Everything else is in, by default and for good.
      #
      # This file used to name the eleven crates to include, and predicted its own next failure:
      # *"an allow-list nobody is reminded to extend is the failure mode; the alternative is
      # excluding the three Windows crates instead, which `--exclude` supports and which fails
      # loudly."* `mdedit-xml`, `mdedit-toml` and `mdedit-ini` had already been missed that way in
      # MDEDIT-94/95/96. The three names were added and the trap was left, so it caught the next
      # three: **`mdedit-app`, `mdedit-image` and `mdedit-text`**.
      #
      # That mattered more than the first time. `mdedit-app` is where nearly every defect of
      # MDEDIT-146 through MDEDIT-154 lived, and `mdedit-image` holds the destination resolver —
      # the trust boundary standing between a Markdown file and a UNC path that leaks an NTLM hash.
      # Four pull requests reported "cargo-mutants passes on the diff" as evidence their tests were
      # not vacuous. Every one of those runs mutated nothing.
      #
      # With `--exclude`, a new crate is covered the day it is created and nobody has to remember.
      # **The exit status is swallowed here, not by `continue-on-error`.** That flag keeps the
      # *workflow* green and still publishes a failing check, and a failing check makes the pull
      # request unmergeable — which is precisely what a job described as "it reports; it does not
      # block" must not do. The fuzz workflow learned the same thing the same way.
      #
      # Survivors and timeouts become warning annotations, and the full report is uploaded below
      # either way. **Which of those happened is read from `mutants.out`, never from the exit
      # code** (MDEDIT-157). cargo-mutants 27 exits 0 all caught, 1 usage, 2 missed, 3 timeout,
      # 4 baseline failed, 5-6 a bad diff filter, 70 internal — and it ranks timeout *above*
      # missed, so a run with survivors and one slow mutant exits 3. Reading the code, as this job
      # used to, reported that run as a broken job and never mentioned the survivors.
      #
      # `--minimum-test-timeout 60`, because the auto-set timeout is the baseline's test time times
      # four, and the baseline runs before the shared pool gets busy. PR #163's got 22 s and three
      # mutants timed out under load. Two of them fail in half a second on a laptop. **The third
      # was a survivor**: `user_event` replaced with `()`, which no test calls, and which the run
      # before had reported as MISSED. So a timeout is not "probably fine" — it is a mutant whose
      # outcome is unknown, and one in three of those was hiding a survivor. The default floor is
      # 20 s; at 60 a genuine infinite loop costs a minute per mutant, and a slow survivor is
      # reported as a survivor.
      - name: Mutate
        run: |
          set +e
          # **A budget for the mutation run itself (MDEDIT-171)**, inside the job's 55 minutes and
          # the pool's 60, leaving room for checkout, the toolchain and building cargo-mutants from
          # source. INT rather than KILL, so cargo-mutants stops the way it does on Ctrl-C and what
          # it has already found is still written to mutants.out for the upload below.
          #
          # **One number, used twice.** It sets the timeout and it decides, below, whether a 137 was
          # this budget's KILL or something else's. Written out twice, a change to one would either
          # report an OOM as running out of time or let a real timeout through as a bare 137.
          budget=2400
          started=$SECONDS
          timeout --signal=INT --kill-after=120 "${budget}s" \
            cargo mutants --in-diff /tmp/pr.diff \
            --test-tool nextest \
            --exclude mdedit-text-dwrite \
            --exclude mdedit-menu-win \
            --exclude mdedit-shell-win \
            --timeout-multiplier 4 \
            --minimum-test-timeout 60 \
            --no-shuffle
          status=$?
          set -e

          # 124 is timeout's own code; 137 is the KILL that follows if cargo-mutants ignored the INT,
          # and counts only after the budget has actually elapsed, so an OOM kill is not reported as
          # running out of time. Either way the diff was only partly mutated, and a partial run must
          # not read as a result — the same rule MDEDIT-157 applies to an unreadable report.
          if [ "$status" -eq 124 ] || { [ "$status" -eq 137 ] && [ $((SECONDS - started)) -ge "$budget" ]; }; then
            missed=$(grep -c '' mutants.out/missed.txt 2>/dev/null || true)
            echo "::error title=Mutants ran out of time::cargo-mutants did not finish within $((budget / 60)) minutes, so this diff was only partly mutated (${missed:-0} survivor(s) found before it stopped). The untested remainder is neither caught nor missed. Split the diff or shard the run rather than raising the limit: the runner pool stops every job at 60 minutes (MDEDIT-171)."
            exit 1
          fi

          # **A job that reports success for having tested nothing is the defect this ticket is
          # about, not a side note.** cargo-mutants exits 0 both when it killed every mutant and
          # when it generated none, and for four pull requests the second was read as the first.
          # `mutants.out/` exists only in the first case, so its absence is the signal.
          #
          # A warning rather than a failure, because zero mutants is often correct: a diff of tests,
          # comments, docs or a workflow file has nothing to mutate. What must not happen is that it
          # passes *silently*.
          # **Guarded on a clean exit, or this swallows the failure it is named after.** A run that
          # dies early — a compile error, a bad flag — also leaves no `mutants.out`, and treating
          # that as "nothing to mutate" would report green for a broken job. Exactly the bug being
          # fixed, one level up.
          if [ "$status" -eq 0 ] && [ ! -d mutants.out ]; then
            # One line, deliberately. A `\`-continued string keeps the indentation of the following
            # line, so a wrapped annotation reaches the reader with runs of spaces in the middle of
            # its sentences — visible in this job's own output before this was written out flat.
            # No backticks either: inside double quotes they are command substitution.
            echo "::warning title=No mutants were generated::cargo-mutants tested nothing on this diff. That is expected for a change to tests, comments, docs or CI, and is a red flag for a change under crates/*/src. Do not cite this job as evidence that a test is not vacuous without checking which of the two it was (MDEDIT-155)."
            exit 0
          fi

          # Everything that means the job itself is broken still fails it: a bad flag, a baseline
          # that is already red, a diff that does not apply, an internal error.
          case "$status" in
            0 | 2 | 3) ;;
            *) exit "$status" ;;
          esac

          # One name per line, created empty at the start of the run (cargo-mutants 27,
          # `output.rs`). `grep -c` counts lines and says 0 for an empty file; a missing one is
          # the next check's business.
          missed=$(grep -c '' mutants.out/missed.txt 2>/dev/null || true)
          timeouts=$(grep -c '' mutants.out/timeout.txt 2>/dev/null || true)
          missed=${missed:-0}
          timeouts=${timeouts:-0}

          # **The exit code and the files must agree, or the files cannot be trusted.** The
          # install step takes whatever cargo-mutants is current, so a release that renames these
          # files would otherwise turn every survivor into a silent pass — the failure MDEDIT-155
          # was about, arriving through an upgrade instead of an allow-list.
          if { [ "$status" -eq 2 ] && [ "$missed" -eq 0 ]; } || { [ "$status" -eq 3 ] && [ "$timeouts" -eq 0 ]; }; then
            echo "::error title=Mutants report unreadable::cargo-mutants exited $status but mutants.out/missed.txt has $missed lines and mutants.out/timeout.txt has $timeouts. The output format may have changed; this job cannot say what the run found (MDEDIT-157)."
            exit 1
          fi

          if [ "$missed" -gt 0 ]; then
            echo "::warning title=Mutants survived::$missed mutant(s) were not caught by any test. Read missed.txt in the mutants-report artifact, and check a survivor is not *equivalent* before writing a test for it: on MDEDIT-88 the sole survivor was | to ^ between two disjoint bitflags, which no test can tell apart."
          fi
          if [ "$timeouts" -gt 0 ]; then
            echo "::warning title=Mutants timed out::$timeouts mutant(s) hit the test timeout, so their outcome is unknown: not caught, not missed. Reproduce each locally before reading it either way. On MDEDIT-156, two of three were caught in under a second off the runner and the third was a survivor in a function no test calls. Listed in timeout.txt in the mutants-report artifact."
          fi
          exit 0

      # The report is the whole output of the job, so it survives the run being tidied away.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
