name: Mutants

# MDEDIT-111, and a **trial** rather than a gate — `continue-on-error`, so a surviving mutant is a
# comment on a pull request rather than a red build. Promote it to blocking if it earns its keep.
#
# What it is for: this is a solo project, so nothing in it has had a second reviewer. cargo-mutants
# is the mechanical version of one — it changes a `<` to a `<=`, deletes a line, replaces a return
# value, and reports what the tests still let through. The review that produced this ticket found
# several tests whose bodies could not fail; that is exactly the class this detects without anybody
# having to read for it.
#
# `--in-diff`, so it mutates only what a pull request changed. A whole-workspace run is hours and
# would never be looked at; a diff-sized one is minutes and lands with the change that caused it.

on:
  pull_request:
  workflow_dispatch:

# A superseded push should stop costing the one runner time it could be giving the next pull request.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (in diff)
    runs-on: [self-hosted, Linux, X64, proxmox, general]
    # A trial. It reports; it does not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the merge base, which a shallow clone does not have.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      # **This workflow can never have a cache, and that is structural** (MDEDIT-132). It runs on
      # `pull_request` and `workflow_dispatch` only, so no `main`-scoped cache is ever written for a
      # pull request to restore — and `save-if` below makes that explicit rather than leaving the job
      # uploading 66–70 MB per run into a scope nothing reads. Registry downloads are the cost, and
      # they are the small half.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # **Built from source, unlike nextest.** The prebuilt `cargo-mutants` was linked against
      # GLIBC 2.39 and the self-hosted box was older than that, so the downloaded binary died on
      # `version 'GLIBC_2.39' not found` before it had done anything. Worth re-testing against the
      # pristine runner image, which may have moved past that — MDEDIT-132 leaves it open rather than
      # guessing, because a failed install step publishes a failing check on a job that must not
      # block.
      - name: Install cargo-mutants
        # **The guard is for a runner that already has the binary, not for a cache.** It used to say
        # `cache-bin: true` kept `~/.cargo/bin` between runs; the log disproves that. On run
        # 31839765178 rust-cache reported `No cache found` at 20:51:02 and six seconds later this
        # step resolved in 26 ms — the binary came off a long-lived runner's disk, not off the GitHub
        # cache. The general pool is ephemeral now, so this compiles ~250 crates every run.
        #
        # It stays because `cargo install` *stops* rather than skips when it finds its own binary in
        # place — `binary 'cargo-mutants' already exists in destination`, exit 101, and a red X on a
        # job whose whole point is to report rather than block. `--force` would avoid that by
        # rebuilding unconditionally, which is what this already effectively does.
        run: |
          if ! command -v cargo-mutants >/dev/null 2>&1; then
            cargo install cargo-mutants --locked
          else
            echo "cargo-mutants $(cargo mutants --version) already on this runner"
          fi

      - name: What this pull request changed
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      # nextest as the runner, for the same isolation reason CI uses it: a mutant that makes a test
      # hang or abort must take down its own process and nothing else.
      #
      # **An exclude list, because the allow-list failed twice (MDEDIT-155).**
      #
      # The three Windows-only crates are named here because they do not build on this runner at
      # all: `mdedit-text-dwrite`, `mdedit-menu-win` and `mdedit-shell-win` are `cfg(windows)`, and
      # their tests want a real system stack anyway. Everything else is in, by default and for good.
      #
      # This file used to name the eleven crates to include, and predicted its own next failure:
      # *"an allow-list nobody is reminded to extend is the failure mode; the alternative is
      # excluding the three Windows crates instead, which `--exclude` supports and which fails
      # loudly."* `mdedit-xml`, `mdedit-toml` and `mdedit-ini` had already been missed that way in
      # MDEDIT-94/95/96. The three names were added and the trap was left, so it caught the next
      # three: **`mdedit-app`, `mdedit-image` and `mdedit-text`**.
      #
      # That mattered more than the first time. `mdedit-app` is where nearly every defect of
      # MDEDIT-146 through MDEDIT-154 lived, and `mdedit-image` holds the destination resolver —
      # the trust boundary standing between a Markdown file and a UNC path that leaks an NTLM hash.
      # Four pull requests reported "cargo-mutants passes on the diff" as evidence their tests were
      # not vacuous. Every one of those runs mutated nothing.
      #
      # With `--exclude`, a new crate is covered the day it is created and nobody has to remember.
      # **The exit status is swallowed here, not by `continue-on-error`.** That flag keeps the
      # *workflow* green and still publishes a failing check, and a failing check makes the pull
      # request unmergeable — which is precisely what a job described as "it reports; it does not
      # block" must not do. The fuzz workflow learned the same thing the same way.
      #
      # A surviving mutant becomes a warning annotation, and the full report is uploaded below
      # either way. cargo-mutants exits 2 for "mutants missed" and 1 for "something went wrong", and
      # the two are told apart so a broken job is still a broken job.
      - name: Mutate
        run: |
          set +e
          cargo mutants --in-diff /tmp/pr.diff \
            --test-tool nextest \
            --exclude mdedit-text-dwrite \
            --exclude mdedit-menu-win \
            --exclude mdedit-shell-win \
            --timeout-multiplier 4 \
            --no-shuffle
          status=$?
          set -e

          # **A job that reports success for having tested nothing is the defect this ticket is
          # about, not a side note.** cargo-mutants exits 0 both when it killed every mutant and
          # when it generated none, and for four pull requests the second was read as the first.
          # `mutants.out/` exists only in the first case, so its absence is the signal.
          #
          # A warning rather than a failure, because zero mutants is often correct: a diff of tests,
          # comments, docs or a workflow file has nothing to mutate. What must not happen is that it
          # passes *silently*.
          # **Guarded on a clean exit, or this swallows the failure it is named after.** A run that
          # dies early — a compile error, a bad flag — also leaves no `mutants.out`, and treating
          # that as "nothing to mutate" would report green for a broken job. Exactly the bug being
          # fixed, one level up.
          if [ "$status" -eq 0 ] && [ ! -d mutants.out ]; then
            # No backticks in this string: it is inside double quotes, where they would be command
            # substitution rather than punctuation.
            echo "::warning title=No mutants were generated::cargo-mutants tested nothing on this \
              diff. That is expected for a change to tests, comments, docs or CI, and is a red flag \
              for a change under crates/*/src. Do not cite this job as evidence that a test is not \
              vacuous without checking which of the two it was (MDEDIT-155)."
            exit 0
          fi

          if [ "$status" -eq 2 ]; then
            echo "::warning title=Mutants survived::Some mutants were not caught by any test. \
              Read the mutants-report artifact — and check the survivor is not *equivalent* before \
              writing a test for it: on MDEDIT-88 the sole survivor was \`|\` to \`^\` between two \
              disjoint bitflags, which no test can tell apart."
            exit 0
          fi
          exit "$status"

      # The report is the whole output of the job, so it survives the run being tidied away.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
