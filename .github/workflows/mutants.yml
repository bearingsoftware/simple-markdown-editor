name: Mutants

# MDEDIT-111, and a **trial** rather than a gate — `continue-on-error`, so a surviving mutant is a
# comment on a pull request rather than a red build. Promote it to blocking if it earns its keep.
#
# What it is for: this is a solo project, so nothing in it has had a second reviewer. cargo-mutants
# is the mechanical version of one — it changes a `<` to a `<=`, deletes a line, replaces a return
# value, and reports what the tests still let through. The review that produced this ticket found
# several tests whose bodies could not fail; that is exactly the class this detects without anybody
# having to read for it.
#
# `--in-diff`, so it mutates only what a pull request changed. A whole-workspace run is hours and
# would never be looked at; a diff-sized one is minutes and lands with the change that caused it.
#
# **Sharded, because a diff-sized run outgrew one job** (MDEDIT-172). MDEDIT-171 gave the run a
# 40-minute budget inside the pool's 60-minute kill and made running out of it an honest error; the
# next pull request, MDEDIT-142's #168, generated 82 mutants and got through 35 of them. The rest
# were run on a laptop, and two survivors came out of the part CI never reached. So `plan` counts
# what the diff generates and `mutants` runs that count in parallel shards, each with the same budget.
#
# **And a weekly sweep of the whole workspace** (MDEDIT-191). Each Sunday one slice of the workspace
# is mutated, rotating through the slices week by week, so every mutant is reached within a lap. It
# lives on the pool, not a laptop, because a Windows machine ran out of memory on it. A survivor
# fails the scheduled run, and GitHub's email for that failure is the notification.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: What to diff against, for re-running a real diff by hand
        required: false
        default: main
      sweep:
        description: Run slice K of the weekly sweep by hand (0-based). Empty runs the diff.
        required: false
        default: ''
  schedule:
    # Sunday 03:00 UTC, when nobody wants the runners.
    - cron: '0 3 * * 0'

# A sweep and a diff run never share a group, so neither cancels the other. Only a superseded pull
# request push should stop costing the one runner time it could be giving the next pull request.
concurrency:
  group: mutants-${{ github.event_name }}-${{ github.ref }}-${{ inputs.sweep }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # **The sweep's lap length, and the per-shard cap that sizes it** (MDEDIT-191). A lap is
  # `MUTANTS_SWEEP_RUNS` weekly runs of `MUTANTS_MAX_SHARDS` shards each, so the workspace is split
  # into `MUTANTS_SWEEP_RUNS * MUTANTS_MAX_SHARDS` round-robin shards. Raise the first as the
  # workspace grows; a shard over `MUTANTS_SWEEP_PER_SHARD` is annotated. Sized from run 40408425052
  # (slice 0 at N=8): a mutant costs about 15 s on the heavy shards, and 146 mutants a shard ran shard
  # 2 out of its 40-minute budget with 35 survivors found and the rest untested. Sixteen slices halve
  # the work per shard, and 80 is the cap that keeps a shard inside the budget at that cost.
  MUTANTS_SWEEP_RUNS: 16
  MUTANTS_SWEEP_PER_SHARD: 80
  # **One copy, read by both jobs**, because the count `plan` emits and the set the shards run have
  # to be the same set. Two lists that must agree is how MDEDIT-155 happened.
  #
  # **An exclude list, because the allow-list failed twice (MDEDIT-155).**
  #
  # The three Windows-only crates are named here because they do not build on this runner at all:
  # `mdedit-text-dwrite`, `mdedit-menu-win` and `mdedit-shell-win` are `cfg(windows)`, and their
  # tests want a real system stack anyway. Everything else is in, by default and for good.
  #
  # This file used to name the eleven crates to include, and predicted its own next failure: *"an
  # allow-list nobody is reminded to extend is the failure mode; the alternative is excluding the
  # three Windows crates instead, which `--exclude` supports and which fails loudly."* `mdedit-xml`,
  # `mdedit-toml` and `mdedit-ini` had already been missed that way in MDEDIT-94/95/96. The three
  # names were added and the trap was left, so it caught the next three: **`mdedit-app`,
  # `mdedit-image` and `mdedit-text`**.
  #
  # That mattered more than the first time. `mdedit-app` is where nearly every defect of MDEDIT-146
  # through MDEDIT-154 lived, and `mdedit-image` holds the destination resolver — the trust boundary
  # standing between a Markdown file and a UNC path that leaks an NTLM hash. Four pull requests
  # reported "cargo-mutants passes on the diff" as evidence their tests were not vacuous. Every one
  # of those runs mutated nothing.
  #
  # With `--exclude`, a new crate is covered the day it is created and nobody has to remember.
  MUTANTS_EXCLUDES: --exclude mdedit-text-dwrite --exclude mdedit-menu-win --exclude mdedit-shell-win
  # **Measured twice, and the second run is why this is fifteen** (MDEDIT-172). Thirty came from PR
  # #163's rate of 60 mutants in 35 minutes; the first sharded run of #168's diff put 28 of them in
  # one shard that ran out of time while the other two finished early, because a mutant's cost is not
  # uniform — one in `mdedit-app` rebuilds the largest crate and runs the largest test suite, at
  # roughly 90 seconds, against nearer 40 for one in `mdedit-document`.
  #
  # Twenty with five shards then ran *slower per mutant*, not faster: see `max-parallel` below. At
  # fifteen, two shards at a time, a shard has both a small enough share of the diff and enough of the
  # host to finish it.
  #
  # **The cost those numbers were measured at is gone (MDEDIT-182).** `mdedit-app`'s tests are one
  # binary now and mutants build without debug info, which took a mutant's rebuild from 135 s to 7 s
  # on one machine. Left at fifteen until a run here measures the new cost — see build-and-test.md.
  #
  # **A run here has now measured it (MDEDIT-186).** Run 36305543827, a dispatch of #183+#184's
  # diff: 135 mutants, 6 shards, 22-23 mutants each against a budget sized for 15, and every shard
  # finished in 2.6-3.2 minutes — one reported `22 mutants tested in 3m: 7 missed, 15 caught`. That
  # is roughly 8 s a mutant against the ~90 s these fifteen were chosen for, and it is nowhere near
  # the 40-minute budget.
  #
  # **Still fifteen, and the reason is no longer cost.** `MUTANTS_MAX_SHARDS` below makes 6 x 15 a
  # deliberate 90-mutant ceiling: past it the workflow tells you to split the pull request rather
  # than take six more runners off a shared pool. Raising this number raises that ceiling with it —
  # 45 would make it 270 — so it trades a norm about pull request size, not runner minutes. Change
  # it when that norm is what you mean to change.
  MUTANTS_PER_SHARD: 15
  # **A decision, not arithmetic.** Six shards of fifteen is 90 mutants; past that a shard still says
  # it ran out of time, because the answer to a diff that large is to split the pull request rather
  # than to take six more runners off everything else queued on this pool. #168, the largest diff
  # this project has produced, generated 82.
  MUTANTS_MAX_SHARDS: 6

jobs:
  plan:
    name: cargo-mutants (plan)
    # **No `proxmox` label, deliberately (FINCH-326).** The general pool spans two hosts: rack's
    # twelve LXC runners and giant's eight. Only rack carries `proxmox`, so naming it here did not
    # express a requirement — it silently pinned every shard below to rack, which is where this
    # workflow's cost lands hardest. A shard rebuilds the tree per mutant in `$TMPDIR`, and on rack
    # `$TMPDIR` is the runner's rootfs on the one SATA SSD every runner and every database shares.
    # giant puts the workspace and `$TMPDIR` on a 16 GiB tmpfs instead, so the same writes never
    # reach a disk. Nothing in this job needs a Proxmox guest: it compiles Rust, reads no internal
    # host and holds no secret.
    #
    # **The cost that made this urgent is gone, and the reason still holds.** FINCH-331 measured a
    # shard at 89.8 GB and 391 MB/s on 2026-09-19; MDEDIT-182 landed after that and a re-measure on
    # 2026-09-27 (run 36305543827, 135 mutants over 6 shards) put a shard at ~1.7 GiB, peaking at
    # 684 MiB of giant's tmpfs. Roughly 50x less. Keep the label off anyway: a shard on rack still
    # writes to the shared SSD for no reason, and giant is half the pool. Do not re-derive urgency
    # from the old number — see proxmox FINCH-400.
    runs-on: [self-hosted, Linux, X64, general]
    # Every diff run reports and does not block; only a sweep can fail here. A sweep must not report
    # green on a failure: `needs.<job>.result` reads success for a job that failed under
    # continue-on-error (MDEDIT-191).
    continue-on-error: ${{ github.event_name != 'schedule' && inputs.sweep == '' }}
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      slice: ${{ steps.mode.outputs.slice }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      mutants: ${{ steps.plan.outputs.mutants }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the merge base, which a shallow clone does not have.
          fetch-depth: 0

      # A schedule is always a sweep. Its slice is whole weeks since the epoch mod N, not the ISO week,
      # which restarts each January and would repeat or skip a slice across New Year. A dispatch sweeps
      # the slice it was given, to re-run one by hand.
      - name: Which mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SWEEP_INPUT: ${{ inputs.sweep }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ] && [ -z "$SWEEP_INPUT" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "slice=" >> "$GITHUB_OUTPUT"
            echo "mode diff"
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            slice=$(( $(date -u +%s) / 604800 % MUTANTS_SWEEP_RUNS ))
          else
            case "$SWEEP_INPUT" in
              *[!0-9]*|'')
                echo "::error title=Bad sweep slice::sweep must be an integer in 0..$((MUTANTS_SWEEP_RUNS - 1)), got '$SWEEP_INPUT'"
                exit 1 ;;
            esac
            slice=$((10#$SWEEP_INPUT))
            if [ "$slice" -ge "$MUTANTS_SWEEP_RUNS" ]; then
              echo "::error title=Bad sweep slice::sweep must be an integer in 0..$((MUTANTS_SWEEP_RUNS - 1)), got $slice"
              exit 1
            fi
          fi
          echo "mode=sweep" >> "$GITHUB_OUTPUT"
          echo "slice=$slice" >> "$GITHUB_OUTPUT"
          echo "mode sweep, slice $slice of $MUTANTS_SWEEP_RUNS"

      - uses: dtolnay/rust-toolchain@stable
      # **This workflow can never have a cache, and that is structural** (MDEDIT-132). It runs on
      # `pull_request` and `workflow_dispatch` only, so no `main`-scoped cache is ever written for a
      # pull request to restore — and `save-if` below makes that explicit rather than leaving the job
      # uploading 66–70 MB per run into a scope nothing reads. Registry downloads are the cost, and
      # they are the small half. The weekly sweep runs on `main` too, so `save-if` excludes schedules
      # by event as well, and it still saves nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}

      # **The prebuilt binary is tried first, which MDEDIT-132 left open.** It was linked against
      # GLIBC 2.39 and the self-hosted box was older, so the download died on `version 'GLIBC_2.39'
      # not found` before doing anything. The image may have moved on; asking costs one step, and a
      # binary that will not run looks exactly like one that is missing to the guard below.
      - uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: cargo-mutants
      - name: Install cargo-mutants
        # **`--version` rather than `command -v`**, so a binary that is present and cannot run — the
        # GLIBC case — falls back to the source build instead of failing the first mutation step with
        # a linker error. **`--force` in the fallback**, because that is exactly the case where the
        # prebuilt binary *is* in place: `cargo install` stops rather than skips when it finds its own
        # binary there (`binary 'cargo-mutants' already exists`, exit 101), which failed this job on
        # the first run of this workflow.
        #
        # The error is printed rather than swallowed: MDEDIT-132 is open on *why* the prebuilt binary
        # does not run here, and a run that says "no usable prebuilt binary" without saying what it
        # said cannot answer it.
        run: |
          if version=$(cargo mutants --version 2>&1); then
            echo "prebuilt cargo-mutants runs on this image: $version"
          else
            echo "no usable prebuilt binary (MDEDIT-132), building from source. It said:"
            echo "$version"
            cargo install cargo-mutants --locked --force
          fi

      # `github.base_ref` is the pull request's target branch and is empty on a dispatch, where the
      # input says what to diff against instead. Without it a dispatch diffs against `origin/` and
      # mutates nothing, which made the workflow impossible to exercise by hand.
      - name: What this pull request changed
        if: steps.mode.outputs.mode == 'diff'
        run: |
          base="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ]; then
            base="${{ inputs.base }}"
            # **A checkout has the remote's refs, not local branches**, so the obvious value for this
            # input — a branch name, and `main` is its own default — is not a revision here and
            # `git diff` fails with "ambiguous argument". A commit SHA resolves either way, which is
            # what the first dispatches happened to pass, so this only showed up when the default was
            # used. Take the input as given when it resolves, and as a remote branch when it does not.
            if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
              base="origin/$base"
            fi
          fi
          echo "diffing against $base"
          git diff "$base"...HEAD > /tmp/pr.diff
          wc -l < /tmp/pr.diff

      # Upload the diff rather than recompute it per shard: every shard has to mutate *the same* set,
      # and two `git diff`s against a branch that moved under them would not.
      # MDEDIT-185: a handoff between jobs of one run, so it is dead the moment the run ends.
      # Without this it inherited the repo default of 14 days and piled up (FINCH-350).
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode == 'diff'
        with:
          name: mutants-diff
          path: /tmp/pr.diff
          retention-days: 1

      # The binary is built once and handed to the shards. Compiling ~250 crates per shard is the
      # cost that would make sharding worse than the problem it fixes, on a pool CI shares.
      - name: Keep the binary for the shards
        run: cp "$(command -v cargo-mutants)" /tmp/cargo-mutants
      # MDEDIT-185: same handoff, and at ~3 MiB a copy it was 104 MiB of the org's
      # Free-plan Actions quota across 33 runs.
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-bin
          path: /tmp/cargo-mutants
          retention-days: 1

      - name: How many shards
        id: plan
        # `--list` parses rather than builds, so counting costs seconds. It takes the same filters as
        # the run: a count of a different set than the shards mutate would put mutants in no shard.
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SLICE: ${{ steps.mode.outputs.slice }}
        run: |
          set -o pipefail

          if [ "$MODE" = sweep ]; then
            # **Each global shard is counted with the same flags the mutate step will use**, so the
            # count is of the set that shard runs. A shard over the cap is annotated, not failed: the
            # cap is a budget, and the sweep's own report is what says whether the budget held.
            T=$((MUTANTS_SWEEP_RUNS * MUTANTS_MAX_SHARDS))
            total=0
            for s in $(seq 0 $((MUTANTS_MAX_SHARDS - 1))); do
              g=$((SLICE * MUTANTS_MAX_SHARDS + s))
              if ! cargo mutants --list $MUTANTS_EXCLUDES --shard "$g/$T" --sharding round-robin > /tmp/sweep-$s.list; then
                echo "::error title=Sweep list failed::cargo-mutants --list failed for global shard $g of $T. A count of zero here would hide it, so the plan fails (MDEDIT-191)."
                echo "shards=[]" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              n=$(grep -c '' /tmp/sweep-$s.list || true)
              n=${n:-0}
              total=$((total + n))
              echo "global shard $g of $T: $n mutant(s)"
              if [ "$n" -gt "$MUTANTS_SWEEP_PER_SHARD" ]; then
                echo "::warning title=Sweep shard over its cap::global shard $g of $T has $n mutants, over the $MUTANTS_SWEEP_PER_SHARD cap. Raise MUTANTS_SWEEP_RUNS so each slice is smaller (MDEDIT-191)."
              fi
            done
            if [ "$total" -eq 0 ]; then
              echo "::error title=Sweep generated no mutants::cargo-mutants listed nothing for slice $SLICE of $MUTANTS_SWEEP_RUNS. The whole workspace cannot generate none, so something is wrong with the list (MDEDIT-191)."
              echo "mutants=0" >> "$GITHUB_OUTPUT"
              echo "shards=[]" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "mutants=$total" >> "$GITHUB_OUTPUT"
            echo "total=$T" >> "$GITHUB_OUTPUT"
            echo "shards=[$(seq -s, 0 $((MUTANTS_MAX_SHARDS - 1)))]" >> "$GITHUB_OUTPUT"
            echo "$total mutants over $MUTANTS_MAX_SHARDS shard(s) of global slice $SLICE, round-robin of $T"
            exit 0
          fi

          cargo mutants --list --in-diff /tmp/pr.diff $MUTANTS_EXCLUDES > /tmp/mutants.list
          total=$(grep -c '' /tmp/mutants.list || true)
          total=${total:-0}
          echo "mutants=$total" >> "$GITHUB_OUTPUT"

          # **A job that reports success for having tested nothing is a defect, not a side note**
          # (MDEDIT-155). cargo-mutants exits 0 both when it killed every mutant and when it
          # generated none, and for four pull requests the second was read as the first. Counting
          # here is what makes the difference sayable: no shards start, and the reason is annotated.
          #
          # A warning rather than a failure, because zero mutants is often correct: a diff of tests,
          # comments, docs or a workflow file has nothing to mutate. What must not happen is that it
          # passes *silently*. One line, deliberately: a `\`-continued string keeps the indentation of
          # the next line and reaches the reader with runs of spaces mid-sentence. No backticks
          # either — inside double quotes they are command substitution.
          if [ "$total" -eq 0 ]; then
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No mutants were generated::cargo-mutants tested nothing on this diff. That is expected for a change to tests, comments, docs or CI, and is a red flag for a change under crates/*/src. Do not cite this job as evidence that a test is not vacuous without checking which of the two it was (MDEDIT-155)."
            exit 0
          fi

          # Ceiling division, clamped: one shard for a small diff, never more than the cap.
          shards=$(( (total + MUTANTS_PER_SHARD - 1) / MUTANTS_PER_SHARD ))
          if [ "$shards" -gt "$MUTANTS_MAX_SHARDS" ]; then
            shards=$MUTANTS_MAX_SHARDS
          fi

          # `--shard k/n` is zero-based and refuses k = n, so the list is 0..n-1.
          list=$(seq -s, 0 $((shards - 1)))
          echo "total=$shards" >> "$GITHUB_OUTPUT"
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"
          echo "$total mutants over $shards shard(s)"

  mutants:
    name: cargo-mutants (shard ${{ matrix.shard }})
    needs: plan
    # No shards for a diff with nothing to mutate; `plan` has already said so.
    if: needs.plan.outputs.shards != '[]'
    runs-on: [self-hosted, Linux, X64, general]
    # A trial: on a pull request it reports and does not block. A sweep must not report green on a
    # failed shard, so there it is not continue-on-error (MDEDIT-191).
    continue-on-error: ${{ needs.plan.outputs.mode != 'sweep' }}
    # **Under the pool's limit, not GitHub's (MDEDIT-171).** The self-hosted pool stops any job
    # at 60 minutes of execution (FINCH-274) whatever the workflow asks for, and with no value
    # here GitHub allowed 360 — so PR #166 lost both attempts' reports to a host-side kill with
    # nothing saying why. This is the backstop; the Mutate step has its own, shorter budget so
    # it can stop cleanly and say so.
    timeout-minutes: 55
    strategy:
      # One shard's survivors must not cancel another's run: each is a separate part of the answer.
      fail-fast: false
      # **Two at a time, because the pool's runners are not independent machines.** They are VMs on
      # one Proxmox host, so five shards do not get five machines' worth of CPU — they get a fifth
      # each. Measured on #168's diff: five shards started together on five different runners, and in
      # the same 41 minutes two managed 16 and 17 mutants while three managed 9. Sharding wider makes
      # each shard slower, which is the opposite of what the budget needs. Two shards keep the host
      # usefully busy without starving each other, and the waves cost wall-clock rather than results.
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.mode == 'diff'
        with:
          name: mutants-diff
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          name: cargo-mutants-bin
          path: /tmp/bin
      - name: Use the binary the plan job built
        # Same pool image, so the binary it built runs here. The fallback is for the day that stops
        # being true, and the log says which path ran rather than leaving it to be inferred.
        run: |
          mkdir -p "$HOME/.cargo/bin"
          if [ -f /tmp/bin/cargo-mutants ]; then
            install -m 755 /tmp/bin/cargo-mutants "$HOME/.cargo/bin/cargo-mutants"
          fi
          if version=$(cargo mutants --version 2>&1); then
            echo "using the binary from the plan job: $version"
          else
            echo "the handed-over binary does not run here, building from source. It said:"
            echo "$version"
            cargo install cargo-mutants --locked --force
          fi

      # nextest as the runner, for the same isolation reason CI uses it: a mutant that makes a test
      # hang or abort must take down its own process and nothing else.
      #
      # **The exit status is swallowed here, not by `continue-on-error`.** That flag keeps the
      # *workflow* green and still publishes a failing check, and a failing check makes the pull
      # request unmergeable — which is precisely what a job described as "it reports; it does not
      # block" must not do. The fuzz workflow learned the same thing the same way.
      #
      # Survivors and timeouts become warning annotations, and the full report is uploaded below
      # either way. **Which of those happened is read from `mutants.out`, never from the exit
      # code** (MDEDIT-157). cargo-mutants 27 exits 0 all caught, 1 usage, 2 missed, 3 timeout,
      # 4 baseline failed, 5-6 a bad diff filter, 70 internal — and it ranks timeout *above*
      # missed, so a run with survivors and one slow mutant exits 3. Reading the code, as this job
      # used to, reported that run as a broken job and never mentioned the survivors.
      #
      # `--minimum-test-timeout 60`, because the auto-set timeout is the baseline's test time times
      # four, and the baseline runs before the shared pool gets busy. PR #163's got 22 s and three
      # mutants timed out under load. Two of them fail in half a second on a laptop. **The third
      # was a survivor**: `user_event` replaced with `()`, which no test calls, and which the run
      # before had reported as MISSED. So a timeout is not "probably fine" — it is a mutant whose
      # outcome is unknown, and one in three of those was hiding a survivor. The default floor is
      # 20 s; at 60 a genuine infinite loop costs a minute per mutant, and a slow survivor is
      # reported as a survivor.
      #
      # **Each shard runs its own baseline.** `--minimum-test-timeout` scales off the baseline's own
      # test time, and a shard whose tests are red before any mutation has to say so rather than
      # report a run built on them.
      #
      # **`--sharding round-robin`, and the default cost a run to learn.** Slice is the default and
      # gives a shard consecutive mutants — which are mostly one file, so the build stays warm. It
      # also means one shard gets every mutant in the most expensive crate: on the first sharded run
      # of #168's diff, shard 0 took all 28 `mdedit-app` mutants and ran out of the 40-minute budget
      # while shards 1 and 2 finished early on `mdedit-document`. Round-robin gives each shard the
      # same mix, so the slowest shard is the average rather than the worst crate.
      - name: Mutate
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.total }}
          MODE: ${{ needs.plan.outputs.mode }}
          SLICE: ${{ needs.plan.outputs.slice }}
        run: |
          set +e
          # **The only difference between the two modes is the scope.** A diff shard mutates its
          # share of the diff; a sweep shard mutates its round-robin share of the whole workspace,
          # which is global shard `slice * MAX_SHARDS + shard` of `N * MAX_SHARDS`.
          if [ "$MODE" = sweep ]; then
            g=$(( SLICE * MUTANTS_MAX_SHARDS + SHARD ))
            scope=(--shard "$g/$SHARDS")
            where="global shard $g of $SHARDS (sweep slice $SLICE)"
            advice="Raise MUTANTS_SWEEP_RUNS so each slice is smaller: the sweep cap is deliberate, and the runner pool stops every job at 60 minutes (MDEDIT-171, MDEDIT-191)."
          else
            scope=(--in-diff /tmp/pr.diff --shard "$SHARD/$SHARDS")
            where="shard $SHARD of $SHARDS"
            advice="Split the pull request: the shard cap is deliberate, and the runner pool stops every job at 60 minutes (MDEDIT-171, MDEDIT-172)."
          fi

          # **A budget for the mutation run itself (MDEDIT-171)**, inside the job's 55 minutes and
          # the pool's 60, leaving room for checkout, the toolchain and the binary. INT rather than
          # KILL, so cargo-mutants stops the way it does on Ctrl-C and what it has already found is
          # still written to mutants.out for the upload below.
          #
          # **One number, used twice.** It sets the timeout and it decides, below, whether a 137 was
          # this budget's KILL or something else's. Written out twice, a change to one would either
          # report an OOM as running out of time or let a real timeout through as a bare 137.
          budget=2400
          started=$SECONDS
          timeout --signal=INT --kill-after=120 "${budget}s" \
            cargo mutants "${scope[@]}" \
            --sharding round-robin \
            --test-tool nextest \
            $MUTANTS_EXCLUDES \
            --timeout-multiplier 4 \
            --minimum-test-timeout 60 \
            --no-shuffle
          status=$?
          set -e

          # 124 is timeout's own code; 137 is the KILL that follows if cargo-mutants ignored the INT,
          # and counts only after the budget has actually elapsed, so an OOM kill is not reported as
          # running out of time. Either way this shard was only partly mutated, and a partial run
          # must not read as a result — the same rule MDEDIT-157 applies to an unreadable report.
          if [ "$status" -eq 124 ] || { [ "$status" -eq 137 ] && [ $((SECONDS - started)) -ge "$budget" ]; }; then
            missed=$(grep -c '' mutants.out/missed.txt 2>/dev/null || true)
            echo "::error title=Shard $SHARD ran out of time::cargo-mutants did not finish $where within $((budget / 60)) minutes, so part of it was not mutated (${missed:-0} survivor(s) found before it stopped). The untested remainder is neither caught nor missed. $advice"
            exit 1
          fi

          # **A missing report is a broken shard**, not an empty diff: `plan` counted the mutants
          # before this job started, so there is something for every shard to do. A run that dies
          # early — a compile error, a bad flag — also leaves no `mutants.out`, and that is exactly
          # what this catches now that "nothing was generated" is answered one job up (MDEDIT-155).
          if [ "$status" -eq 0 ] && [ ! -d mutants.out ]; then
            echo "::error title=Shard $SHARD produced no report::The plan job counted mutants for $where, so it had work to do and left no mutants.out. The run did not get as far as mutating anything; read the step log rather than treating this as a pass (MDEDIT-155, MDEDIT-172)."
            exit 1
          fi

          # Everything that means the job itself is broken still fails it: a bad flag, a baseline
          # that is already red, a diff that does not apply, an internal error.
          case "$status" in
            0 | 2 | 3) ;;
            *) exit "$status" ;;
          esac

          # One name per line, created empty at the start of the run (cargo-mutants 27,
          # `output.rs`). `grep -c` counts lines and says 0 for an empty file; a missing one is
          # the next check's business.
          missed=$(grep -c '' mutants.out/missed.txt 2>/dev/null || true)
          timeouts=$(grep -c '' mutants.out/timeout.txt 2>/dev/null || true)
          missed=${missed:-0}
          timeouts=${timeouts:-0}

          # **The exit code and the files must agree, or the files cannot be trusted.** The
          # install step takes whatever cargo-mutants is current, so a release that renames these
          # files would otherwise turn every survivor into a silent pass — the failure MDEDIT-155
          # was about, arriving through an upgrade instead of an allow-list.
          if { [ "$status" -eq 2 ] && [ "$missed" -eq 0 ]; } || { [ "$status" -eq 3 ] && [ "$timeouts" -eq 0 ]; }; then
            echo "::error title=Shard $SHARD report unreadable::cargo-mutants exited $status but mutants.out/missed.txt has $missed lines and mutants.out/timeout.txt has $timeouts. The output format may have changed; this job cannot say what the run found (MDEDIT-157)."
            exit 1
          fi

          if [ "$missed" -gt 0 ]; then
            echo "::warning title=Mutants survived in shard $SHARD::$missed mutant(s) were not caught by any test. Read missed.txt in the mutants-report-shard-$SHARD artifact, and check a survivor is not *equivalent* before writing a test for it: on MDEDIT-88 the sole survivor was | to ^ between two disjoint bitflags, which no test can tell apart."
          fi
          if [ "$timeouts" -gt 0 ]; then
            echo "::warning title=Mutants timed out in shard $SHARD::$timeouts mutant(s) hit the test timeout, so their outcome is unknown: not caught, not missed. Reproduce each locally before reading it either way. On MDEDIT-156, two of three were caught in under a second off the runner and the third was a survivor in a function no test calls. Listed in timeout.txt in the mutants-report-shard-$SHARD artifact."
          fi
          # The only marker sweep-report trusts. Written here and nowhere else, so a shard that
          # failed or ran out of time leaves none, whatever the job's result says (MDEDIT-191).
          touch mutants.out/shard-done
          exit 0

      # The report is the whole output of the job, so it survives the run being tidied away. One name
      # per shard: two uploads under one name is a failed upload or a lost half of the evidence.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: mutants.out/
          # A re-run of a failed job uploads the same name again; without this it fails the upload.
          overwrite: true
          if-no-files-found: ignore

  # The sweep's verdict (MDEDIT-191). It fails on a new survivor or timeout, meaning one that is not
  # in `.github/mutants-sweep-baseline.txt`, and on every shard that did not finish. Known survivors
  # are counted, not failed: the first lap has 215 of them, and a red run on each would stop meaning
  # anything. Not `continue-on-error`, so a scheduled run that fails is what emails the owner.
  sweep-report:
    name: mutants sweep (report)
    needs: [plan, mutants]
    # `schedule` and a dispatch with a slice are the only sweeps. Keyed on the event rather than the
    # plan's mode, so a plan that died before choosing one still gets a verdict.
    if: always() && (github.event_name == 'schedule' || inputs.sweep != '')
    runs-on: [self-hosted, Linux, X64, general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mutants-sweep-baseline.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-report-shard-*
          path: /tmp/reports
          merge-multiple: false

      - name: Check every shard reported, and compare survivors with the baseline
        id: compare
        env:
          SLICE: ${{ needs.plan.outputs.slice }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
        run: |
          set -uo pipefail
          reports_ok=1
          count=0
          if [ -d /tmp/reports ]; then
            count=$(find /tmp/reports -mindepth 1 -maxdepth 1 -type d -name 'mutants-report-shard-*' | wc -l)
          fi
          missing=""
          for s in $(seq 0 $((MUTANTS_MAX_SHARDS - 1))); do
            [ -f "/tmp/reports/mutants-report-shard-$s/shard-done" ] || missing="$missing $s"
          done
          if [ "$count" -ne "$MUTANTS_MAX_SHARDS" ] || [ -n "$missing" ]; then
            reports_ok=0
            echo "::error title=Sweep shards did not all finish::Expected $MUTANTS_MAX_SHARDS mutants-report-shard-* artifacts, each with a shard-done marker. Found $count artifact(s); shard(s) without a marker:${missing:- none}. A shard that ran out of time, failed its baseline or failed to install does not finish, and an unfinished shard leaves part of the workspace unchecked (MDEDIT-191)."
          fi
          echo "reports_ok=$reports_ok" >> "$GITHUB_OUTPUT"

          touch /tmp/missed.txt /tmp/timeout.txt /tmp/caught.txt
          if [ -d /tmp/reports ]; then
            find /tmp/reports -name missed.txt -exec cat {} + >> /tmp/missed.txt
            find /tmp/reports -name timeout.txt -exec cat {} + >> /tmp/timeout.txt
            find /tmp/reports -name caught.txt -exec cat {} + >> /tmp/caught.txt
          fi

          # `path:line:col: text` becomes `KIND path: text`, so an edit elsewhere in a file does not
          # move its entry. Duplicates stay: the same mutation can occur twice in one function, and
          # `comm` compares them as a multiset on sorted input.
          sed -E 's/^([^:]+):[0-9]+:[0-9]+: /MISSED \1: /' /tmp/missed.txt > /tmp/cur-missed.txt
          sed -E 's/^([^:]+):[0-9]+:[0-9]+: /TIMEOUT \1: /' /tmp/timeout.txt > /tmp/cur-timeout.txt
          cat /tmp/cur-missed.txt /tmp/cur-timeout.txt | LC_ALL=C sort > /tmp/current.txt
          LC_ALL=C sort .github/mutants-sweep-baseline.txt > /tmp/baseline.txt
          LC_ALL=C comm -13 /tmp/baseline.txt /tmp/current.txt > /tmp/new.txt
          known=$(LC_ALL=C comm -12 /tmp/baseline.txt /tmp/current.txt | wc -l)
          new=$(grep -c '' /tmp/new.txt || true)
          new=${new:-0}
          echo "new=$new" >> "$GITHUB_OUTPUT"

          # Baseline entries for the files this slice mutated, that did not reappear. Another slice
          # may own them, so this is a list to read, not a failure.
          cat /tmp/missed.txt /tmp/timeout.txt /tmp/caught.txt | sed -E 's/^([^:]+):.*/\1/' \
            | LC_ALL=C sort -u > /tmp/slice-files.txt
          awk 'NR == FNR { f[$0] = 1; next } { p = $0; sub(/^[A-Z]+ /, "", p); sub(/:.*/, "", p); if (p in f) print }' \
            /tmp/slice-files.txt /tmp/baseline.txt > /tmp/baseline-slice.txt
          LC_ALL=C comm -23 /tmp/baseline-slice.txt /tmp/current.txt > /tmp/fixed.txt
          fixed=$(grep -c '' /tmp/fixed.txt || true)
          fixed=${fixed:-0}

          {
            echo "## Mutants sweep: slice $SLICE of $MUTANTS_SWEEP_RUNS (MDEDIT-191)"
            echo
            echo "- Shards with a shard-done marker: $count of $MUTANTS_MAX_SHARDS"
            echo "- Known survivors and timeouts (in the baseline): $known"
            echo "- New, not in the baseline: $new"
            echo "- Plan: $PLAN_RESULT, shards: $MUTANTS_RESULT"
            if [ "$new" -gt 0 ]; then
              echo
              echo "New. Each one needs a test that kills it, or a baseline line with a reason:"
              echo '```'
              cat /tmp/new.txt
              echo '```'
            fi
            if [ "$fixed" -gt 0 ]; then
              echo
              echo "Baseline lines for this slice's files that did not reappear. Possibly fixed; drop"
              echo "them from the baseline, after checking another slice does not own them:"
              echo '```'
              cat /tmp/fixed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the new survivors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-new-survivors
          path: /tmp/new.txt
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        env:
          REPORTS_OK: ${{ steps.compare.outputs.reports_ok }}
          NEW: ${{ steps.compare.outputs.new }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
        run: |
          if [ "$REPORTS_OK" != 1 ] || [ "$PLAN_RESULT" != success ] || [ "$MUTANTS_RESULT" != success ]; then
            echo "::error title=Sweep did not finish::The plan or a shard failed, was cancelled or was skipped, or reported short (plan $PLAN_RESULT, shards $MUTANTS_RESULT, reports ok $REPORTS_OK). Part of the workspace is unchecked (MDEDIT-191)."
            exit 1
          fi
          if [ -z "$NEW" ] || [ "$NEW" -gt 0 ]; then
            echo "::error title=Sweep found new survivors::${NEW:-unknown} survivor(s) or timeout(s) are not in .github/mutants-sweep-baseline.txt. Each needs a test that kills it, or a baseline line with a reason. The list is in the step summary and the sweep-new-survivors artifact (MDEDIT-191)."
            exit 1
          fi
